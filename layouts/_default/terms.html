{{ define "main" }}
<section class="page">
    <div class="wrap">
        <header class="page-head">
            <p class="crumb"><a href="/">cloudgeist.cloud</a> / tags</p>
            <h1 class="page-title">Tags</h1>
        </header>
        <ul class="tag-cloud">
            {{ range .Data.Terms.Alphabetical }}
            <li><a class="tag tag--lg" href="{{ .Page.RelPermalink }}">#{{ .Name }}</a> ({{ .Count }})</li>
            {{ end }}
        </ul>
    </div>
</section>
{{ end }}
