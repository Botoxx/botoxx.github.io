baseURL = "https://cloudgeist.cloud/"
title = "Botond Geiszt"
enableEmoji = true
enableRobotsTXT = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  description = "Cloud Engineer · AI integration · Hungary. Personal site and notes by Botond Geiszt."
  author = "Botond Geiszt"
  jobtitle = "Cloud Engineer · AI Integrator"
  motto = "Cloud-native infrastructure and AI agents in production."
  github = "https://github.com/botoxx"
  linkedin = "https://www.linkedin.com/in/botond-geiszt-82b91b167/"
  email = "botond@cloudgeist.cloud"
  ogImage = "/og-cover.png"
  calcom = "YOUR_CALCOM_HANDLE"
  # Contact relay (infra/contact-relay): the Lambda function URL. Empty hides the Send button and its fields.
  contactEndpoint = "https://tyecuuafk3rt3t2ah2pueh7xzq0pfcia.lambda-url.eu-central-1.on.aws/"
  # Proof-of-work difficulty in bits; must match pow_bits in infra/contact-relay.
  contactPowBits = 18

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github-dark"
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
